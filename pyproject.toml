[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chinook-mcp-server"
version = "0.1.0"
description = "Read-only MCP server that lets AI assistants explore and query the Chinook SQLite database"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-CHINOOK.md"]
authors = [{ name = "Arslan Munawar" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
chinook-mcp-server = "chinook_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chinook_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
